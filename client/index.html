<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
    <meta name="color-scheme" content="light dark">
    <!-- Set a saved theme before the page paints, so it never flashes the other one (as views/includes/theme.ejs). -->
    <script>try { var t = localStorage.getItem("na3db-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NA3DB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
